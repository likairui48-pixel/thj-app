# Android APK 自动构建（基于已实战验证的模板）
# 关键点: Java 17 / Flutter 钉死 3.24.5 / release 用 debug 签名（可直接安装）/
#        split-per-abi + universal 双产出

name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_PREFIX: thj-app

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★ 钉死版本。松了会因为 Flutter 升级导致 API 不兼容而构建失败。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # 首轮非阻塞，稳定后再改硬性检查
      - name: Analyze (非阻塞)
        run: flutter analyze || true

      - name: Run tests (if any)
        run: flutter test --no-pub || echo "no tests yet"

      - name: Build split-per-abi APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Collect and rename APKs
        run: |
          set -e
          mkdir -p dist
          A="$ARTIFACT_PREFIX"
          cp build/app/outputs/flutter-apk/app-release.apk        dist/${A}-universal.apk
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]   && \
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk     dist/${A}-arm64.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk   dist/${A}-arm32.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]      && \
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk        dist/${A}-x86_64.apk || true
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-apk
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
