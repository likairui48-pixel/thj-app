name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - next
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/thj-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/thj-app-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/thj-app-x86_64.apk
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thj-app-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-next') }}
          name: 同禾境全新版 ${{ github.ref_name }}
          files: |
            dist/thj-app-arm64.apk
            dist/thj-app-arm32.apk
            dist/thj-app-x86_64.apk
          generate_release_notes: true
