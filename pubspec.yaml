name: thj_app
description: "同禾境 · 社区客户端 —— 液态玻璃 · 黑白双主题 · 消息提示"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络
  http: 1.2.2
  # 本地存储（会话 Cookie / 设置 / 缓存）
  shared_preferences: 2.3.3
  # 系统通知（消息提示）
  flutter_local_notifications: 17.2.3
  # 网页容器（登录 / 充值 / 论坛详情等，与站点共享 Cookie）
  webview_flutter: 4.10.0
  # 打开外部链接（更新下载 / QQ 群）
  url_launcher: 6.3.1
  # 相册选图（头像 / 主页背景 / 聊天发图 / 充值凭证）
  # Android 13+ 走系统相册选择器，不需要读相册权限
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
